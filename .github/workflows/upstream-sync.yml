name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Update indices
        run: node shared/scripts/update-upstream-indices.mjs

      - name: Verify PR automation token
        env:
          PR_AUTOMATION_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          if [ -z "${PR_AUTOMATION_TOKEN}" ]; then
            echo "::error::Missing PR_AUTOMATION_TOKEN secret. Configure a PAT with repo and workflow scopes so automation-created PRs trigger pull_request CI."
            exit 1
          fi

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}
          commit-message: "chore: refresh upstream indices"
          title: "chore: refresh upstream indices"
          body: |
            Automated refresh of upstream indices under `shared/references/`.

            - WordPress core versions (from api.wordpress.org)
            - Gutenberg releases (from GitHub Releases API)
            - WordPress ↔ Gutenberg mapping (from developer.wordpress.org docs)
          branch: chore/upstream-indices
          delete-branch: true
